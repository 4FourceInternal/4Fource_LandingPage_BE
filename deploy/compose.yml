# Same database / Docker pattern as DevDNA (compose.yml on the Pi).
# Run from this directory (uses deploy/.env automatically):
#   docker compose up -d

services:
  mysql:
    image: mysql:8
    platform: linux/arm64
    container_name: fource-mysql
    restart: always

    security_opt:
      - seccomp:unconfined

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - fource-db-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    platform: linux/arm64
    container_name: fource-backend
    restart: always

    security_opt:
      - seccomp:unconfined

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "${STRAPI_PORT:-1337}:1337"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

    volumes:
      - fource-uploads:/app/public/uploads

  frontend:
    image: ${FRONTEND_IMAGE}
    platform: linux/arm64
    container_name: fource-frontend
    restart: always

    security_opt:
      - seccomp:unconfined

    depends_on:
      - backend

    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  fource-db-data:
  fource-uploads:
